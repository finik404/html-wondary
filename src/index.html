<!DOCTYPE html>
<html lang="en">
    <!-- Meta -->
    @@include('./blocks/main/head.html', {
    "title": "meta_title",
    })
    <body class="hidden-before-init">
        <!-- Container -->
        <div class="container">
            @@include('./blocks/header.html')
            <!-- Main section -->
            <section class="main">
                <div class="box">
                    <!-- img -->
                    <img data-lang-src="img/screens/{lang}/learning.png"
                         src="img/screens/ru/learning.png"
                         alt="screen1"
                         class="screen screen1"
                    >
                    <!-- content -->
                    <div class="content">
                        <p class="pretitle" data-i18n="main_pretitle"></p>
                        <h2 data-i18n="main_title"></h2>
                        <p class="text" data-i18n="main_text"></p>
                        <button class="btn" id="scrollBtn" data-i18n="download"></button>
                    </div>
                </div>
                <!-- patterns -->
                <div class="patterns">
                    <img src="./img/patterns/01.svg" alt="pattern1" class="pattern1">
                    <img src="./img/patterns/02.svg" alt="pattern2" class="pattern2">
                </div>
            </section>
            <!-- Benefits section -->
            <section class="benefits">
                <h2 data-i18n="benefits_title"></h2>
                <p class="text" data-i18n="benefits_text"></p>
                <div class="list">
                    <div class="benefit">
                        <div class="img">
                            <img src="./img/benefits/01.svg" alt="benefit" />
                        </div>
                        <div>
                            <h4 data-i18n="benefit1_title"></h4>
                            <p data-i18n="benefit1_text"></p>
                        </div>
                    </div>
                    <div class="benefit">
                        <div class="img">
                            <img src="./img/benefits/02.svg" alt="benefit" />
                        </div>
                        <div>
                            <h4 data-i18n="benefit2_title"></h4>
                            <p data-i18n="benefit2_text"></p>
                        </div>
                    </div>
                    <div class="benefit">
                        <div class="img">
                            <img src="./img/benefits/03.svg" alt="benefit" />
                        </div>
                        <div>
                            <h4 data-i18n="benefit3_title"></h4>
                            <p data-i18n="benefit3_text"></p>
                        </div>
                    </div>
                    <div class="benefit">
                        <div class="img">
                            <img src="./img/benefits/04.svg" alt="benefit" />
                        </div>
                        <div>
                            <h4 data-i18n="benefit4_title"></h4>
                            <p data-i18n="benefit4_text"></p>
                        </div>
                    </div>
                </div>
            </section>
            <!-- Download section -->
            <section class="download" id="download">
                <!-- content -->
                <div class="content">
                    <h1 data-i18n="download_title"></h1>
                    <p class="text" data-i18n="download_text"></p>
                    <div class="buttons">
                        <a href="#" class="download_btn">
                            <img src="./img/stores/google-play.svg" alt="Google Play" />
                            <div>
                                <p class="download_btn-pretitle" data-i18n="available"></p>
                                <p class="download_btn-label">Google Play</p>
                            </div>
                        </a>
                        <a href="#" class="download_btn rustore-btn">
                            <img src="./img/stores/rustore.svg" alt="RuStore" />
                            <div>
                                <p class="download_btn-pretitle" data-i18n="available"></p>
                                <p class="download_btn-label">RuStore</p>
                            </div>
                        </a>
                    </div>
                </div>
                <!-- images -->
                <div class="images">
                    <img data-lang-src="img/screens/{lang}/stats.png"
                         src="img/screens/ru/stats.png"
                         alt="screen2"
                         class="screen screen2"
                    >
                    <img data-lang-src="img/screens/{lang}/categories.png"
                         src="img/screens/ru/categories.png"
                         alt="screen3"
                         class="screen screen3"
                    >
                </div>
                <!-- patterns -->
                <div class="patterns">
                    <img src="./img/patterns/03.svg" alt="pattern3" class="pattern3">
                    <img src="./img/patterns/04.svg" alt="pattern4" class="pattern4">
                </div>
            </section>
        </div>
        @@include('./blocks/footer.html')
        <!-- Scripts -->
        @@include('./blocks/main/js.html')
    </body>
</html>
